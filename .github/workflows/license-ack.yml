name: license-ack

# Licensing acknowledgement gate for pull requests.
#
# .github/PULL_REQUEST_TEMPLATE.md prefills every PR description with the
# line
#
#   - [ ] I license this contribution under the Apache License 2.0, ...
#
# and this workflow fails until the author ticks it. Listed as a required
# status check on `main`, so the merge button stays grey for an unticked
# PR, fork or not. Nothing here needs write access: the PR body comes from
# the event payload, so the job runs with an empty permission set and a
# plain `pull_request` trigger (never `pull_request_target`, which would
# hand fork code a write token).
#
# Maintainers are exempt, since they already contribute under the project's
# license. A PR passes without the box when its author is:
#   - listed in the repository variable LICENSE_ACK_EXEMPT (comma-separated
#     GitHub logins; Settings > Secrets and variables > Actions > Variables).
#     This works whatever the maintainer's org-membership visibility;
#   - or the repository OWNER, an org MEMBER or a COLLABORATOR according to
#     GitHub. A private org membership is reported as CONTRIBUTOR, which is
#     why the variable exists.
# Both the author login and its association come from GitHub in the event
# payload, and a PR cannot change repository variables, so neither can be
# claimed by the PR itself.
#
# Triggers: PR opened, reopened, new commits pushed, or description edited
# (ticking the box is an edit, which re-runs the check).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  license-ack:
    runs-on: ubuntu-latest
    steps:
      - name: Check the licensing box is ticked
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          EXEMPT: ${{ vars.LICENSE_ACK_EXEMPT }}
        run: |
          if printf '%s' "$EXEMPT" | tr ',' '\n' | tr -d ' ' | grep -qixF -- "$AUTHOR_LOGIN"; then
            echo "Maintainer PR ($AUTHOR_LOGIN is in LICENSE_ACK_EXEMPT): licensing acknowledgement not required."
            exit 0
          fi
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Maintainer PR ($AUTHOR_ASSOCIATION): licensing acknowledgement not required."
              exit 0
              ;;
          esac
          if printf '%s' "$PR_BODY" | tr -d '\r' | grep -qiE '^\s*-\s*\[x\]\s+I license this contribution under the Apache License 2\.0'; then
            echo "Licensing acknowledgement found."
          else
            echo "::error::Licensing acknowledgement missing."
            echo "Edit the PR description and tick the box:"
            echo "  - [x] I license this contribution under the Apache License 2.0, the same license as the project."
            echo "The line is prefilled by the PR template; restore it if it was removed."
            exit 1
          fi
